# Optional. Run it by hand from Actions -> "Build APK" -> Run workflow, and type the tag
# (e.g. v0.2.0). Or from a terminal:  gh workflow run apk.yml -f tag=v0.2.0
# Runs the Flutter tests, builds a release APK and attaches it to that tag's GitHub Release,
# so a phone can download it straight from the Releases page.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build, e.g. v0.2.0'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write   # attach the APK to the Release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cat_id_app
    steps:
      - name: Check the tag looks like a version
        working-directory: .
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag must look like v1.2.3 or v1.2.3-name"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # The release build is signed with the "shared" key in build.gradle.kts, which reads
      # CATID_KEYSTORE. This is the Mac's own ~/.android/debug.keystore, so these APKs install
      # as updates over the app already on the phones, keeping saved servers, API keys and
      # "Who am I".
      - name: Restore the signing key
        working-directory: .
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Add the DEBUG_KEYSTORE_B64 secret first (see the setup notes)"; exit 1
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "CATID_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: flutter test
        run: flutter test

      - name: Build the APK
        # versionName comes from the tag (v0.2.0 -> 0.2.0). versionCode must go up every
        # build or Android refuses the update; minutes since 1970 always does.
        run: |
          VERSION="${{ inputs.tag }}"
          flutter build apk --release \
            --build-name="${VERSION#v}" \
            --build-number=$(( $(date +%s) / 60 ))
          mv build/app/outputs/flutter-apk/app-release.apk "build/cat-id-${VERSION}.apk"

      # Fails the run if the APK isn't signed with the Mac's key, so a wrong key shows up
      # here instead of as "App not installed" on the phone.
      - name: Check the APK is signed with the Mac's key
        run: |
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          GOT=$("$SIGNER" verify --print-certs "build/cat-id-${{ inputs.tag }}.apk" 2>/dev/null \
                | grep 'SHA-256' | awk '{print $NF}')
          echo "APK key: $GOT"
          [ "$GOT" = "31873a2035c9a5cdeab5f21eb643729700e5ce63c49abe55ae0218c767835183" ] \
            || { echo "::error::APK is not signed with the shared key"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: cat_id_app/build/cat-id-${{ inputs.tag }}.apk
          fail_on_unmatched_files: true

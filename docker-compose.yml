services:
  # Tailscale sidecar: puts cat-id (and only cat-id) on the tailnet as "cat-id", so the app
  # works away from home at https://cat-id.<tailnet>.ts.net. Nothing is opened on the router.
  # cat-id shares this container's network (network_mode below), so the tailnet sees only
  # this one container: not the server, not the home network, not Postgres.
  # Tailscale Serve (config at the bottom) answers HTTPS on 443 and proxies to cat-id:8000.
  # The access rules in the Tailscale admin console limit who can reach it (only port 443).
  # First start needs TS_AUTHKEY in .env (tagged tag:catserver); after that the login is kept
  # in the tailscale-state volume and the key isn't used again. Without a key (e.g. testing on
  # the Mac) this just waits for a login and cat-id still works on :8000.
  # If this container restarts on its own, cat-id loses its network: `docker compose up -d cat-id`.
  tailscale:
    image: tailscale/tailscale:stable   # pin a version (e.g. v1.x.y) once it's working
    hostname: cat-id                    # the tailnet machine name
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_EXTRA_ARGS: "--advertise-tags=tag:catserver"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"              # no /dev/net/tun or extra privileges needed
    volumes:
      - tailscale-state:/var/lib/tailscale
    configs:
      - source: ts-serve
        target: /config/serve.json
    # cat-id's port is published here (cat-id can't publish ports with network_mode).
    # Same as before: the Pi, the app on the home Wi-Fi and deploy.yml's /health check use it.
    ports:
      - "8000:8000"

  cat-id:
    # The server pulls a released version (deploy.yml sets CAT_ID_TAG, e.g. 0.2.0).
    # `docker compose up --build` still builds locally (on the Mac) as before.
    image: ghcr.io/mokarromrahman/cat-id:${CAT_ID_TAG:-latest}
    build:
      context: .
      # Shown by GET /health. Local builds say "dev"; to stamp a commit:
      #   CAT_ID_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
      args:
        CAT_ID_VERSION: "${CAT_ID_VERSION:-dev}"
        CAT_ID_COMMIT: "${CAT_ID_COMMIT:-}"
    restart: unless-stopped
    # Uses the tailscale container's network. Port 8000 is published there, and `db` still
    # resolves by name.
    network_mode: service:tailscale
    environment:
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      COUGH_DISCORD_WEBHOOK_URL: "${COUGH_DISCORD_WEBHOOK_URL}"
      CHORES_DISCORD_WEBHOOK_URL: "${CHORES_DISCORD_WEBHOOK_URL:-}"
      API_KEY: "${API_KEY:-}"
      MIN_CONF: "0.75"
      # Not used by app.py yet; ready for when the event tables are added.
      # postgresql+psycopg:// makes SQLAlchemy use the psycopg 3 driver.
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-catid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-catid}"
    # Start db first, but don't wait for it to be healthy: cat-id must keep taking photos and
    # posting to Discord even when Postgres is down. The server retries the DB itself at startup.
    depends_on:
      tailscale:
        condition: service_started
      db:
        condition: service_started
    volumes:
      - ./data:/app/data         # labeled photos: data/Litten, data/Shinx, data/neither
      - ./inbox:/app/inbox        # new captures awaiting labels
      - ./model.joblib:/app/model.joblib
      - ./embeddings_cache.npz:/app/embeddings_cache.npz
      - ./hf_cache:/app/hf_cache  # pretrained weights download once

  db:
    image: postgres:18
    restart: unless-stopped
    # Run a tiny init as PID 1. Without it, a process left over from `docker exec` or a
    # timed-out healthcheck is adopted by Postgres, and if it exits with an error Postgres
    # treats it as a crashed backend and restarts every connection (seen in testing).
    init: true
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-catid}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-catid}"
    volumes:
      - pgdata:/var/lib/postgresql   # the database files; survive rebuilds and restarts
    # Only reachable from the server itself. To connect from your Mac (e.g. a GUI client),
    # change to "5432:5432" -- then anyone on the home network can reach it with the password.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  tailscale-state:   # the tailnet login; survives rebuilds and redeploys

# Inline (not a separate file) because deploy.yml only checks out docker-compose.yml.
# $$ keeps compose from filling in TS_CERT_DOMAIN; Tailscale replaces it with
# cat-id.<tailnet>.ts.net. Needs MagicDNS and HTTPS certificates on in the admin console.
# Funnel (public internet) is explicitly off.
configs:
  ts-serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://127.0.0.1:8000" } }
          }
        },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": false }
      }